<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validació HTML5</title>
</head>

<body>

    <h1>Formulari amb validació HTML5</h1>

    <form action="#" method="post">

        <!-- Correu electrònic -->
        <label for="email">Correu electrònic:</label><br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@gmail.com"
            required
        >

        <br><br>

        <!-- Contrasenya -->
        <label for="password">Contrasenya:</label><br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínim 8 caràcters"
            minlength="8"
            required
        >

        <br><br>


        <!-- Telèfon -->
        <label for="telefon">Número de telèfon:</label><br>

        <input
            type="tel"
            id="telefon"
            name="telefon"
            placeholder="123456789"
            pattern="[0-9]{9}"
            maxlength="9"
            required
        >

        <br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
