<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacta'm</title>
</head>

<body>

    <h1>Contacta'm</h1>

    <p>
        Si vols posar-te en contacte amb mi, pots omplir aquest formulari.
    </p>

    <form action="#" method="post">

        <label for="nom">Nom:</label><br>
        <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Escriu el teu nom"
            required
        >
        <br><br>

        <label for="email">Correu electrònic:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Escriu el teu correu electrònic"
            required
        >
        <br><br>

        <label for="missatge">Missatge:</label><br>
        <textarea
            id="missatge"
            name="missatge"
            rows="6"
            cols="40"
            placeholder="Escriu el teu missatge"
            required
        ></textarea>
        <br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
